[preset.3.options]

# Threads off means no SharedArrayBuffer, which means the build runs on hosts
# that will not serve cross-origin isolation headers (itch.io, plain S3, most
# CDNs). The simulation is a few thousand float operations per tick - it does
# not need threads. Turn this on only if profiling says otherwise, and only
# once the host is serving COOP/COEP.
variant/thread_support=false
variant/extensions_support=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=true
